name: hidden_role_flutter
description: "نقش پنهان — دستیار گرداننده‌ی بازی‌های نقش مخفی (سناریوی سرکوب)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  file_picker: 10.3.8
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/roles/
    - assets/sounds/

dependency_overrides:
  jni: ^1.0.2
