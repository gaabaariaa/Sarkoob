name: Apply modern defense UI
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration script
        run: python3 tools/integrate_modern_defense.py
      - name: Commit integration and clean up
        run: |
          rm tools/integrate_modern_defense.py
          rm .github/workflows/one-time-modern-defense.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/game_flow_screen.dart lib/widgets/modern_defense_panel.dart tools/integrate_modern_defense.py .github/workflows/one-time-modern-defense.yml
          git commit -m 'feat: modernize defense phase UI'
          git push
