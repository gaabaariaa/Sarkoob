name: Apply source color fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported color constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/game_flow_screen.dart')
          s = p.read_text()
          if 'Colors.white45' not in s:
              raise SystemExit('Colors.white45 not found')
          p.write_text(s.replace('Colors.white45', 'Colors.white54'))
          PY
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/game_flow_screen.dart
          git commit -m 'fix: replace unsupported Colors.white45'
          git push
