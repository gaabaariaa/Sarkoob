name: Apply Flutter color fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  actions: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported color constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/game_flow_screen.dart')
          s = p.read_text()
          old = 'Colors.white45'
          new = 'Colors.white54'
          if old not in s:
              raise SystemExit('Colors.white45 not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/game_flow_screen.dart
          git commit -m 'fix: replace unsupported Colors.white45'
          git push
      - name: Trigger Flutter CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run flutter-build.yml --ref main
