name: Flutter CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge scenario setup into StartGameScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/start_game_screen.dart')
          s = p.read_text(encoding='utf-8')
          init_old = '''  @override
  void initState() {
    super.initState();
    _loadRoster();
  }
'''
          init_new = '''  @override
  void initState() {
    super.initState();
    if (widget.initialScenario != null) {
      _selectedScenario = widget.initialScenario;
    }
    _draftPlayers.addAll(widget.initialPlayers);
    _loadRoster();
  }
'''
          if init_old in s:
              s = s.replace(init_old, init_new, 1)
          ctor_old = '''class StartGameScreen extends StatefulWidget {
  const StartGameScreen({super.key});

  @override
  State<StartGameScreen> createState() => _StartGameScreenState();
}
'''
          ctor_new = '''class StartGameScreen extends StatefulWidget {
  final GameScenario? initialScenario;
  final List<String> initialPlayers;

  const StartGameScreen({
    super.key,
    this.initialScenario,
    this.initialPlayers = const [],
  });

  @override
  State<StartGameScreen> createState() => _StartGameScreenState();
}
'''
          if ctor_old in s:
              s = s.replace(ctor_old, ctor_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          if ! git diff --quiet -- lib/screens/start_game_screen.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/start_game_screen.dart
            git commit -m "fix: bridge scenario setup into start game"
            git push
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (non-blocking)
        run: flutter analyze || true
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
