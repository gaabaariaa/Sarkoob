name: Apply scenario setup bridge
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch StartGameScreen constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/start_game_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = '''  @override
  void initState() {
    super.initState();
    _loadRoster();
  }
'''
          new = '''  @override
  void initState() {
    super.initState();
    if (widget.initialScenario != null) {
      _selectedScenario = widget.initialScenario;
    }
    _draftPlayers.addAll(widget.initialPlayers);
    _loadRoster();
  }
'''
          if old not in s:
              raise SystemExit('initState marker not found')
          s = s.replace(old, new, 1)
          old = '''class StartGameScreen extends StatefulWidget {
  const StartGameScreen({super.key});

  @override
  State<StartGameScreen> createState() => _StartGameScreenState();
}
'''
          new = '''class StartGameScreen extends StatefulWidget {
  final GameScenario? initialScenario;
  final List<String> initialPlayers;

  const StartGameScreen({
    super.key,
    this.initialScenario,
    this.initialPlayers = const [],
  });

  @override
  State<StartGameScreen> createState() => _StartGameScreenState();
}
'''
          if old not in s:
              raise SystemExit('constructor marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/start_game_screen.dart
          git commit -m "fix: bridge scenario setup into start game"
          git push
