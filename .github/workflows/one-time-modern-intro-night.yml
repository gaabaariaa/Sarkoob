name: One-time modern voting migration
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 tools/modernize_voting.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/game_flow_screen.dart tools/modernize_voting.py .github/workflows/one-time-modern-intro-night.yml
          git rm tools/modernize_voting.py .github/workflows/one-time-modern-intro-night.yml
          git commit -m 'feat: modernize voting and elimination flow'
          git push
